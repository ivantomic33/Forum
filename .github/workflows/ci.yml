name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Secret scan
        run: npm run check:secrets

      - name: Lint (TypeScript)
        run: npm run lint

      - name: Backend typecheck
        run: npx --prefix server tsc --noEmit -p server/tsconfig.json

      - name: Unit + integration tests
        run: npm run test

      # Analiza §7.7 — source mape u Sentry. Bez `SENTRY_AUTH_TOKEN` (forks/PR) koraci
      # se preskaču, a build je isti kao lokalno (`sourcemap: false`).
      - name: Install sentry-cli
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        run: curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION=2.39.1 bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Build (with source map upload)
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_CLI_PATH: sentry-cli
