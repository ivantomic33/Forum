name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Secret scan
        run: npm run check:secrets

      - name: Lint (TypeScript)
        run: npm run lint

      - name: Backend typecheck
        run: npx --prefix server tsc --noEmit -p server/tsconfig.json

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
